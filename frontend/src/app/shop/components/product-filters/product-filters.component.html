<div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl shadow-black/20 border border-white/10 p-6 space-y-8 sticky top-24">

  <!-- Filtro por Categoría --> 
  <div>
    <h3 class="text-xl font-bold text-white mb-4 border-b border-white/10 pb-2">Categorías</h3>
    <ul class="space-y-2">
      <li>    
        <a href="#" 
           (click)="selectCategory(null, $event)"
           [ngClass]="{
             'bg-cyan-500/30 text-cyan-300 font-semibold': selectedCategoryId === null,
             'text-white/80 hover:text-white': selectedCategoryId !== null
           }"
           class="block px-4 py-2 rounded-lg transition duration-200">
          Todas
        </a>
      </li>
      <li *ngFor="let category of categories">
        <a href="#" 
           (click)="selectCategory(category.id, $event)"
           [ngClass]="{
            'bg-cyan-500/30 text-cyan-300 font-semibold': selectedCategoryId === category.id,
            'text-white/80 hover:text-white': selectedCategoryId !== category.id
           }"
           class="block px-4 py-2 rounded-lg transition duration-200">
          {{ category.name }}
        </a>
      </li>
    </ul>
  </div>

  <!-- Filtro por Precio -->
  <form [formGroup]="filterForm">
    <h3 class="text-xl font-bold text-white mb-4 border-b border-white/10 pb-2">Precio</h3>
    <div class="flex items-center space-x-2">
      <div class="relative w-1/2">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/50">$</span>
        <input type="number" 
               formControlName="minPrice"
               placeholder="Mín"
               class="w-full bg-black/20 border border-white/10 rounded-lg py-2 pl-7 pr-2 text-white placeholder-white/50 focus:ring-cyan-500 focus:border-cyan-500 transition">
      </div>
      <div class="relative w-1/2">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/50">$</span>
        <input type="number" 
               formControlName="maxPrice"
               placeholder="Máx"
               class="w-full bg-black/20 border border-white/10 rounded-lg py-2 pl-7 pr-2 text-white placeholder-white/50 focus:ring-cyan-500 focus:border-cyan-500 transition">
      </div>
    </div>
  </form>

  <!-- Acciones -->
  <div class="pt-4">
    <button (click)="clearFilters()"
            class="w-full bg-white/10 hover:bg-white/20 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
      Limpiar Filtros
    </button>
  </div>

</div>
