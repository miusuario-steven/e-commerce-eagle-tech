<app-header-user></app-header-user>

<app-header-user></app-header-user>

<section class="min-h-screen bg-transparent px-4 py-16 text-white">
  <div class="max-w-7xl mx-auto">
    
    <!-- Encabezado de la Tienda -->
    <div class="text-center mb-12">
      <h1 class="text-4xl sm:text-5xl font-extrabold mb-2 text-gray-100 drop-shadow-xl">Nuestro Catálogo</h1>
      <p class="text-gray-300 text-lg">Explora la galaxia de productos que Eagle Tech tiene para ti.</p>
    </div>

    <!-- Contenedor Glassmorphism para el contenido principal -->
    <div class="relative border border-violet-500/40 rounded-xl bg-white/10 backdrop-blur-lg ring-2 ring-violet-500/20 shadow-neon-violet transition-all duration-500 p-6">

      <!-- Fondo galáctico animado (opcional, si se desea un efecto similar al header) -->
      <div class="absolute inset-0 bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd opacity-90 -z-10 bg-[length:400%_400%] animate-gradient rounded-xl"></div>

      <div class="relative z-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Columna de Filtros (Sidebar) -->
        <aside class="lg:col-span-1">
          <app-product-filters 
            [categories]="(categories$ | async) || []"
            [initialCriteria]="shopService.searchCriteria$ | async"
            (filtersChanged)="onFiltersChanged($event)">
          </app-product-filters>
        </aside>

        <!-- Contenido Principal (Parrilla de Productos) -->
        <main class="lg:col-span-3">
          <ng-container *ngIf="(productsResponse$ | async) as response">
            <app-product-grid
              [products]="response.content"
              [paginationInfo]="response"
              [isLoading]="(isLoading$ | async) || false"
              (pageChanged)="onPageChanged($event)"
              (sortChanged)="onSortChanged($event)">
            </app-product-grid>
          </ng-container>
        </main>

      </div>
    </div>
  </div>
</section>
