<app-header-user></app-header-user>

<!-- 🌌 Fondo galáctico detalle producto -->
<section class="relative min-h-screen bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd bg-[length:400%_400%] animate-gradient px-4 py-16 overflow-hidden">

  <!-- 💫 Efecto de supernova en fondo -->
  <div class="absolute w-[600px] h-[600px] bg-galaxyBurst opacity-10 rounded-full blur-3xl animate-spin-slow top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>

  <!-- 📦 Contenido principal -->
  <div class="relative z-10 max-w-6xl mx-auto">
    
    <!-- Breadcrumb y título -->
    <div class="mb-10 text-white animate-fade-slide-up">
      <h1 class="text-3xl sm:text-4xl font-bold mb-2">Eagle Tech <span class="text-cyan-400">Producto</span></h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/" class="hover:underline text-cyan-300">Home</a></li>
          <li>/</li>
          <li>Producto</li>
        </ol>
      </nav>
    </div>

    <!-- Tarjeta del producto -->
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl text-white p-6 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-8 animate-fade-slide-up">
      
      <!-- Imagen del producto -->
      <div class="flex justify-center items-center">
        <img [src]="urlImage" alt="{{ name }}" class="w-full max-w-sm object-contain rounded-xl shadow-md" />
      </div>

      <!-- Detalles -->
      <div>
        <h2 class="text-2xl sm:text-3xl font-bold mb-4">{{ name }}</h2>
        <div class="mb-4">
          <span class="text-cyan-400 text-xl font-bold">${{ price }}</span>
        </div>
        <p class="text-white/80 mb-6 leading-relaxed">Descripción: {{ description }}</p>

        <!-- Selector de cantidad -->
        <label for="quantity" class="block mb-1 text-sm text-white/90">Cantidad:</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          [(ngModel)]="quantity"
          min="1"
          max="5"
          value="1"
          autocomplete="off"
          class="w-24 px-4 py-2 bg-white/20 backdrop-blur text-white rounded-lg border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400 mb-6"
        />

        <!-- Botón de acción -->
        <button
          (click)="addCart(id)"
          class="bg-cyan-500 hover:bg-cyan-600 hover:shadow-[0_0_15px_3px_#9333ea] px-6 py-3 rounded-lg font-semibold transition text-white shadow-md"
        >
          Añadir al carrito
        </button>
      </div>
    </div>
  </div>
</section>
