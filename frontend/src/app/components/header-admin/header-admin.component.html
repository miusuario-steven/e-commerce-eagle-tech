<!-- 🌌 Header Admin Galáctico Glass Futurista -->
<nav class="fixed top-0 left-0 w-full z-50 text-white">
  <div
    class="relative border border-violet-500/40 rounded-b-xl bg-white/10 backdrop-blur-lg ring-2 ring-violet-500/20 shadow-neon-violet transition-all duration-500 hover:ring-4">

    <!-- 🌌 Fondo galáctico animado -->
    <div class="absolute inset-0 bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd opacity-90 -z-10 bg-[length:400%_400%] animate-gradient rounded-b-xl"></div>

    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

      <!-- 🚀 Logo -->
      <a [routerLink]="['/admin']" class="flex items-center space-x-2 hover:opacity-90 transition">
        <img src="http://localhost:8085/image/logo.png" alt="Logo" class="h-10 drop-shadow-md">
      </a>

      <!-- 📱 Botón hamburguesa (móvil) -->
      <button (click)="toggleMenu()" class="sm:hidden focus:outline-none">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- 🧭 Menú -->
      <div [ngClass]="{ 'hidden': !isMenuOpen }"
        class="absolute sm:static top-16 right-4 sm:top-auto sm:right-auto bg-white/10 sm:bg-transparent rounded-xl sm:rounded-none shadow-xl sm:shadow-none sm:flex sm:items-center space-y-4 sm:space-y-0 sm:space-x-6 p-4 sm:p-0 text-sm backdrop-blur-md border border-white/10 sm:border-none">

        <ng-container *ngIf="isLoggedIn$ | async">
          <a routerLink="/admin/category" class="block hover:text-violet-300 transition font-semibold">Categorías</a>
          <a routerLink="/admin/product" class="block hover:text-violet-300 transition font-semibold">Productos</a>
          <a href="#" class="block hover:text-violet-300 transition font-semibold">Usuarios</a>
          <a routerLink="/admin/orders" class="block hover:text-violet-300 transition font-semibold">Órdenes</a>
          <a routerLink="/logout" class="block text-red-400 hover:text-red-500 transition font-semibold">Salir</a>
        </ng-container>
      </div>

    </div>
  </div>
</nav>
