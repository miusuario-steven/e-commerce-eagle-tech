<header class="bg-gray-900/80 backdrop-blur-md text-white fixed top-0 left-0 w-full shadow z-50">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
    
    <!-- Logo -->
    <a routerLink="/" class="flex items-center space-x-2">
      <img src="http://localhost:8085/image/logo.png" alt="Logo" class="h-10">
      <span class="text-white font-bold text-lg">Eagle Tech</span>
    </a>

    <!-- Buscador -->
    <form class="hidden md:flex items-center space-x-2">
      <input
        type="text"
        placeholder="Buscar"
        class="px-3 py-1 rounded-md bg-white/10 border border-white/20 placeholder-white/70 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400"
      />
      <button
        type="submit"
        class="px-4 py-1 bg-cyan-500 hover:bg-cyan-600 rounded-md text-white text-sm font-medium"
      >
        Buscar
      </button>
    </form>

    <!-- Enlaces -->
    <nav class="flex items-center space-x-4 text-sm">
      <a routerLink="/cart/sumary" class="hover:text-cyan-400 transition">Carrito</a>
      <a routerLink="/user/login" class="hover:text-cyan-400 transition">Login</a>
    </nav>
  </div>
</header>
