<header class="fixed top-0 left-0 w-full z-50 text-white">
  <div class="relative border border-violet-500/40 rounded-b-xl bg-white/10 backdrop-blur-lg ring-2 ring-violet-500/20 shadow-neon-violet transition-all duration-500 hover:ring-4">


    <!-- 🌌 Fondo animado galáctico detrás -->
    <div class="absolute inset-0 bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd opacity-90 -z-10 bg-[length:400%_400%] animate-gradient rounded-b-xl"></div>

    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between px-4 py-3 gap-4">

      <!-- 🚀 Logo -->
      <a routerLink="/" class="flex items-center space-x-2 hover:opacity-90 transition">
        <img src="http://localhost:8085/image/logo.png" alt="Logo" class="h-10 drop-shadow-md">
      </a>

      <!-- 🔍 Buscador -->
      <form class="hidden md:flex items-center space-x-2">
        <input
          type="text"
          placeholder="Buscar productos"
          class="px-3 py-1 rounded-md bg-white/10 border border-white/20 placeholder-white/70 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 backdrop-blur-sm"
        />
        <button
          type="submit"
          class="px-4 py-1 bg-cyan-500 hover:bg-cyan-600 rounded-md text-white text-sm font-semibold shadow-md shadow-cyan-900/40"
        >
          Buscar
        </button>
      </form>

      <!-- 🛒 Navegación -->
      <nav class="flex items-center space-x-4 text-sm">
        <a routerLink="/cart/sumary" class="hover:text-violet-300 transition font-medium">Carrito</a>
        
        <ng-container *ngIf="isLoggedIn; else loggedOut">
          <a routerLink="/order-history" class="hover:text-violet-300 transition font-medium">Mis Órdenes</a>
          <a routerLink="/logout" class="hover:text-violet-300 transition font-medium">Cerrar Sesión</a>
        </ng-container>

        <ng-template #loggedOut>
          <a routerLink="/user/login" class="hover:text-violet-300 transition font-medium">Login</a>
        </ng-template>
      </nav>
    </div>
  </div>
</header>
