<div
  *ngIf="visible()"
  class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] sm:w-auto px-6 py-4 rounded-xl shadow-xl flex items-center gap-4 animate-fade-in z-50"
  [ngClass]="{
    'bg-green-100 text-green-800 border border-green-300': type() === 'success',
    'bg-red-100 text-red-800 border border-red-300': type() === 'error',
    'bg-yellow-100 text-yellow-800 border border-yellow-300': type() === 'warning',
    'bg-blue-100 text-blue-800 border border-blue-300': type() === 'info'
  }"
  role="alert"
>
  <!-- Ícono -->
  <span *ngIf="type() === 'success'">✅</span>
  <span *ngIf="type() === 'error'">❌</span>
  <span *ngIf="type() === 'info'">ℹ️</span>
  <span *ngIf="type() === 'warning'">⚠️</span>

  <!-- Mensaje -->
  <span class="text-sm font-medium">{{ message() }}</span>
</div>
