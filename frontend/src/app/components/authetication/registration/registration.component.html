<app-header-user></app-header-user>

<section class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-xl bg-white/10 backdrop-blur-md rounded-2xl shadow-xl text-white p-8">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-center">Registro</h2>

    <form (ngSubmit)="register()" class="space-y-5">
      <!-- Nombre -->
      <div>
        <label for="name" class="block mb-1 text-sm font-medium">Nombre</label>
        <input
          [(ngModel)]="name"
          type="text"
          id="name"
          name="name"
          placeholder="Ingrese su nombre"
          autocomplete="off"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Apellido -->
      <div>
        <label for="surname" class="block mb-1 text-sm font-medium">Apellido</label>
        <input
          [(ngModel)]="surname"
          type="text"
          id="surname"
          name="surname"
          placeholder="Ingrese su apellido"
          autocomplete="off"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-1 text-sm font-medium">Email</label>
        <input
          [(ngModel)]="email"
          type="email"
          id="email"
          name="email"
          placeholder="Ingrese su email"
          autocomplete="off"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Dirección -->
      <div>
        <label for="address" class="block mb-1 text-sm font-medium">Dirección</label>
        <input
          [(ngModel)]="address"
          type="text"
          id="address"
          name="address"
          placeholder="Ingrese su dirección"
          autocomplete="off"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Teléfono -->
      <div>
        <label for="cellphone" class="block mb-1 text-sm font-medium">Teléfono</label>
        <input
          [(ngModel)]="cellphone"
          type="text"
          id="cellphone"
          name="cellphone"
          placeholder="Ingrese su teléfono"
          autocomplete="off"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block mb-1 text-sm font-medium">Contraseña</label>
        <input
          [(ngModel)]="password"
          type="password"
          id="password"
          name="password"
          placeholder="Ingrese su contraseña"
          autocomplete="off"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button
          type="submit"
          class="w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg font-semibold transition"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</section>
