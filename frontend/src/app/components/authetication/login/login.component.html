<app-header-user></app-header-user>

<section class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white/10 backdrop-blur-md rounded-2xl shadow-xl text-white p-8">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-center">Ingresar</h2>

    <form (ngSubmit)="login()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="block mb-1 text-sm font-medium">Email</label>
        <input
          [(ngModel)]="username"
          type="email"
          id="email"
          name="email"
          placeholder="Ingrese su email"
          required
          autocomplete="off"
          class="w-full px-4 py-2 rounded-lg bg-white/20 backdrop-blur-sm text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block mb-1 text-sm font-medium">Contraseña</label>
        <input
          [(ngModel)]="password"
          type="password"
          id="password"
          name="password"
          placeholder="Ingrese su contraseña"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 backdrop-blur-sm text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button
          type="submit"
          class="w-full bg-cyan-500 hover:bg-cyan-600 text-white py-2 px-4 rounded-lg font-semibold transition"
        >
          Ingresar
        </button>
      </div>
    </form>

    <!-- Enlace a registro -->
    <div class="text-center mt-6">
      <a [routerLink]="['/user/register']" class="text-cyan-300 hover:underline">
        ¿No tienes cuenta? Regístrate
      </a>
    </div>
  </div>
</section>
