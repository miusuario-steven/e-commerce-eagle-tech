<app-header-user></app-header-user>

<!-- 🌌 Fondo galáctico para login -->
<section class="relative min-h-screen bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd bg-[length:400%_400%] animate-gradient flex items-center justify-center px-4 py-16 overflow-hidden">

  <!-- 💫 Supernova animada -->
  <div class="absolute w-[500px] h-[500px] bg-galaxyBurst opacity-10 rounded-full blur-3xl animate-spin-slow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>

  <!-- 💎 Tarjeta login -->
  <div class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl text-white p-8 animate-fade-slide-up">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-center">Ingresar</h2>

    <form (ngSubmit)="login()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="block mb-1 text-sm font-medium">Email</label>
        <input
          [(ngModel)]="username"
          type="email"
          id="email"
          name="email"
          placeholder="Ingrese su email"
          required
          autocomplete="off"
          class="w-full px-4 py-2 rounded-lg bg-white/20 backdrop-blur text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block mb-1 text-sm font-medium">Contraseña</label>
        <input
          [(ngModel)]="password"
          type="password"
          id="password"
          name="password"
          placeholder="Ingrese su contraseña"
          required
          class="w-full px-4 py-2 rounded-lg bg-white/20 backdrop-blur text-white placeholder-white/70 border border-white/20 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button
          type="submit"
          class="w-full bg-cyan-500 hover:bg-cyan-600 hover:shadow-[0_0_15px_3px_#9333ea] text-white py-2 px-4 rounded-lg font-semibold transition shadow-md"
        >
          Ingresar
        </button>
      </div>
    </form>

    <!-- Enlace a registro -->
    <div class="text-center mt-6">
      <a [routerLink]="['/user/register']" class="text-cyan-300 hover:underline hover:text-cyan-400 transition">
        ¿No tienes cuenta? Regístrate
      </a>
    </div>
  </div>
</section>
