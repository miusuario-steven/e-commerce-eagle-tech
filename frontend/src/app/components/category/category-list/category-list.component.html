<app-header-admin></app-header-admin>

<!-- 🌌 Fondo galáctico para listado -->
<section class="relative min-h-screen bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd bg-[length:400%_400%] animate-gradient px-4 py-16 text-white overflow-hidden">

  <!-- 💫 Supernova de fondo -->
  <div class="absolute w-[600px] h-[600px] bg-galaxyBurst opacity-10 rounded-full blur-3xl animate-spin-slow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>

  <div class="relative z-10 max-w-6xl mx-auto">

    <!-- 🧭 Encabezado y breadcrumb -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold mb-2">Eagle Tech Admin <span class="text-cyan-400">Categorías</span></h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/" class="hover:underline text-cyan-300">Home</a></li>
          <li>/</li>
          <li>Ver Categorías</li>
        </ol>
      </nav>
    </div>

    <!-- ➕ Botón crear categoría -->
    <div class="mb-8">
      <a
        routerLink="/admin/category/add"
        class="bg-cyan-500 hover:bg-cyan-600 hover:shadow-[0_0_15px_3px_#9333ea] text-white px-4 py-2 rounded-lg font-semibold transition shadow-md"
      >
        Crear Categoría
      </a>
    </div>

    <!-- 🗂️ Tabla de categorías con glassmorphism -->
    <div class="overflow-x-auto bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl animate-fade-slide-up">
      <table class="min-w-full text-sm text-white">
        <thead>
          <tr class="bg-white/10 text-left text-white/80 border-b border-white/10">
            <th class="py-3 px-4">Nombre</th>
            <th class="py-3 px-4">Editar</th>
            <th class="py-3 px-4">Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of categories" class="border-b border-white/10 hover:bg-white/5 transition">
            <td class="py-2 px-4">{{ c.name }}</td>
            <td class="py-2 px-4">
              <a
                [routerLink]="['/admin/category/update', c.id]"
                class="bg-yellow-400 hover:bg-yellow-500 text-black px-3 py-1 rounded-md font-semibold transition"
              >
                Editar
              </a>
            </td>
            <td class="py-2 px-4">
              <button
                (click)="deleteCategoryById(c.id)"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md font-semibold transition"
              >
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</section>
