<app-header-admin></app-header-admin>

<section class="min-h-screen bg-transparent px-4 py-10 text-white">
  <div class="max-w-5xl mx-auto">

    <!-- Encabezado y Botón de Crear -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-100">Gestión de Categorías</h1>
      <a routerLink="/admin/category/add" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">
        &#43; Añadir Categoría
      </a> 
    </div>  

    <!-- Contenedor Glassmorphism para la tabla y controles -->
    <div class="relative border border-violet-500/40 rounded-xl bg-white/10 backdrop-blur-lg ring-2 ring-violet-500/20 shadow-neon-violet transition-all duration-500 p-6">

      <!-- Fondo galáctico animado (opcional, si se desea un efecto similar al header) -->
      <div class="absolute inset-0 bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd opacity-90 -z-10 bg-[length:400%_400%] animate-gradient rounded-xl"></div>

      <!-- Barra de Búsqueda y Paginación -->
      <div class="relative z-10 flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0">
        <div class="relative w-full md:w-1/3">
          <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="doSearch()" placeholder="Buscar por nombre..." class="w-full px-4 py-2 border border-violet-500/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500 bg-white/5 text-white placeholder-gray-300">
          <button (click)="doSearch()" class="absolute right-0 top-0 h-full px-4 text-violet-300 hover:text-violet-500 transition">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </button>
        </div>

        <div class="flex items-center space-x-4">
          <label for="pageSize" class="text-gray-200">Mostrar:</label>
          <select id="pageSize" (change)="updatePageSize($event)" [(ngModel)]="pageSize" class="border border-violet-500/40 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 bg-white/5 text-white">
            <option [value]="5">5</option>
            <option [value]="10">10</option>
            <option [value]="20">20</option>
            <option [value]="50">50</option>
          </select>
        </div>
      </div>

      <!-- Tabla de Categorías -->
      <div class="overflow-x-auto relative z-10">
        <table class="min-w-full bg-white/5 rounded-lg overflow-hidden">
          <thead class="bg-violet-800/40 text-white">
            <tr>
              <th class="w-1/6 py-3 px-4 uppercase font-semibold text-sm text-left">ID</th>
              <th class="w-3/6 py-3 px-4 uppercase font-semibold text-sm text-left">Nombre</th>
              <th class="w-2/6 py-3 px-4 uppercase font-semibold text-sm text-center">Acciones</th>
            </tr>
          </thead>
          <tbody class="text-gray-100">
            <tr *ngIf="totalElements === 0">
              <td colspan="3" class="text-center py-6 text-gray-300">No hay categorías para mostrar.</td>
            </tr>
            <tr *ngFor="let category of categories; let i = index" [ngClass]="{'bg-white/5': i % 2 !== 0}">
              <td class="py-3 px-4">{{ category.id }}</td>
              <td class="py-3 px-4">{{ category.name }}</td>
              <td class="py-3 px-4 text-center">
                <a [routerLink]="['/admin/category/update', category.id]" class="text-yellow-400 hover:text-yellow-500 font-semibold mr-4 transition">
                  Editar
                </a>
                <button (click)="deleteCategory(category.id)" class="text-red-400 hover:text-red-500 font-semibold transition">
                  Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Controles de Paginación -->
      <div *ngIf="totalPages > 0" class="relative z-10 flex justify-between items-center mt-6">
        <button (click)="goToPage(pageNumber - 1)" [disabled]="pageNumber === 0" class="bg-violet-600/40 hover:bg-violet-700/60 text-white font-bold py-2 px-4 rounded-l-lg transition duration-300 border border-violet-500/40">
          Anterior
        </button>
        <span class="text-gray-100">
          Página {{ pageNumber + 1 }} de {{ totalPages }} ({{ totalElements }} elementos)
        </span>
        <button (click)="goToPage(pageNumber + 1)" [disabled]="pageNumber === totalPages - 1" class="bg-violet-600/40 hover:bg-violet-700/60 text-white font-bold py-2 px-4 rounded-r-lg transition duration-300 border border-violet-500/40">
          Siguiente
        </button>
      </div>

    </div>

  </div>
</section>
