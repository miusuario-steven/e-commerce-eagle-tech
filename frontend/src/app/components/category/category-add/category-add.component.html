<app-header-admin></app-header-admin>

<!-- 🌌 Fondo galáctico para categoría -->
<section class="relative min-h-screen bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd bg-[length:400%_400%] animate-gradient px-4 py-16 text-white overflow-hidden">

  <!-- 💫 Glow animado supernova -->
  <div class="absolute w-[500px] h-[500px] bg-galaxyBurst opacity-10 rounded-full blur-3xl animate-spin-slow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0"></div>

  <div class="relative z-10 max-w-3xl mx-auto">

    <!-- 🧭 Breadcrumb + título -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-2">Crear Categoría</h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/admin/category" class="hover:text-cyan-300">Categorías</a></li>
          <li>/</li>
          <li>Crear</li>
        </ol>
      </nav>
    </div>

    <!-- 📝 Formulario glassmorphism -->
    <form (ngSubmit)="addCategory()" class="space-y-6 bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8 animate-fade-slide-up">
      <input type="hidden" [(ngModel)]="id" name="id" />

      <!-- Campo nombre -->
      <div>
        <label for="name" class="block mb-1 text-sm font-medium">Nombre de la categoría</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          placeholder="Ingrese el nombre de la categoría"
          required
          minlength="3"
          autocomplete="off"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-white/70 border border-white/30 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Botón -->
      <div class="text-left">
        <button
          type="submit"
          class="bg-cyan-500 hover:bg-cyan-600 hover:shadow-[0_0_15px_3px_#9333ea] text-white px-6 py-3 rounded-lg font-semibold transition shadow-md"
        >
          Guardar categoría
        </button>
      </div>
    </form>

  </div>
</section>
