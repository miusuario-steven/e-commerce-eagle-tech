<app-header-admin></app-header-admin>

<section class="min-h-screen bg-transparent px-4 py-10 text-white">
  <div class="max-w-2xl mx-auto">

    <!-- Contenedor Glassmorphism para el formulario -->
    <div class="relative border border-violet-500/40 rounded-xl bg-white/10 backdrop-blur-lg ring-2 ring-violet-500/20 shadow-neon-violet transition-all duration-500 p-6">

      <!-- Fondo galáctico animado (opcional, si se desea un efecto similar al header) -->
      <div class="absolute inset-0 bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd opacity-90 -z-10 bg-[length:400%_400%] animate-gradient rounded-xl"></div>

      <!-- Formulario -->
      <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="relative z-10 p-2">

        <!-- Título dinámico -->
        <h1 class="text-3xl font-bold text-gray-100 mb-6">{{ pageTitle }}</h1>

        <!-- Campo de Nombre -->
        <div class="mb-6">
          <label for="name" class="block text-gray-200 text-sm font-bold mb-2">Nombre de la Categoría</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="Ej: Electrónica, Ropa, Hogar"
            class="w-full px-4 py-2 border border-violet-500/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500 bg-white/5 text-white placeholder-gray-300"
            [ngClass]="{ 'border-red-500': f['name'].invalid && (f['name'].dirty || f['name'].touched) }"
          />
          <div *ngIf="f['name'].invalid && (f['name'].dirty || f['name'].touched)" class="text-red-400 text-xs italic mt-2">
            <div *ngIf="f['name'].errors?.['required']">El nombre es obligatorio.</div>
            <div *ngIf="f['name'].errors?.['minlength']">Debe tener al menos 3 caracteres.</div>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end space-x-4">
          <a routerLink="/admin/category" class="bg-gray-600/40 hover:bg-gray-700/60 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300 border border-gray-500/40">
            Cancelar
          </a>
          <button type="submit" [disabled]="categoryForm.invalid" class="bg-violet-600/40 hover:bg-violet-700/60 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300 disabled:bg-gray-400/40 border border-violet-500/40">
            {{ isEditMode ? 'Actualizar Categoría' : 'Guardar Categoría' }}
          </button>
        </div>

      </form>
    </div>

  </div>
</section>
