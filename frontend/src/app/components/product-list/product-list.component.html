<app-header-admin></app-header-admin>

<section class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 px-4 py-10 text-white">
  <div class="max-w-7xl mx-auto">

    <!-- Encabezado -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold mb-2">Eagle Tech Admin <span class="text-cyan-400">Productos</span></h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/" class="hover:underline text-cyan-300">Home</a></li>
          <li>/</li>
          <li>Ver Productos</li>
        </ol>
      </nav>
    </div>

    <!-- Botón crear producto -->
    <div class="mb-6">
      <button
        (click)="goToAddProductForm()"
        class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg font-semibold transition"
      >
        Crear Producto
      </button>
    </div>

    <!-- Tabla de productos -->
    <div class="overflow-x-auto bg-white/10 backdrop-blur-md rounded-xl shadow-lg">
      <table class="min-w-full text-sm text-white">
        <thead>
          <tr class="bg-white/10 text-left text-white/80 border-b border-white/10">
            <th class="py-3 px-4">Código</th>
            <th class="py-3 px-4">Nombre</th>
            <th class="py-3 px-4">Descripción</th>
            <th class="py-3 px-4">Precio</th>
            <th class="py-3 px-4">Editar</th>
            <th class="py-3 px-4">Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of products" class="border-b border-white/10 hover:bg-white/5">
            <td class="py-2 px-4">{{ product.code }}</td>
            <td class="py-2 px-4">{{ product.name }}</td>
            <td class="py-2 px-4">{{ product.description }}</td>
            <td class="py-2 px-4">${{ product.price }}</td>
            <td class="py-2 px-4">
              <button
                [routerLink]="['/admin/product/update', product.id]"
                class="bg-yellow-400 hover:bg-yellow-500 text-black px-3 py-1 rounded-md font-semibold"
              >
                Editar
              </button>
            </td>
            <td class="py-2 px-4">
              <button
                (click)="deleteProductById(product.id)"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md font-semibold"
              >
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</section>
