<app-header-admin></app-header-admin>

<section class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 px-4 py-10 text-white">
  <div class="max-w-4xl mx-auto">

    <!-- Título + Breadcrumb -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-2">Crear Producto</h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/" class="hover:text-cyan-400">Home</a></li>
          <li>/</li>
          <li>Crear Producto</li>
        </ol>
      </nav>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="addProduct()" enctype="multipart/form-data" class="space-y-6 bg-white/10 backdrop-blur-md p-6 rounded-xl shadow-lg">
      <input type="hidden" [(ngModel)]="id" name="id" />

      <!-- Categoría -->
      <div>
        <label class="block mb-1 text-sm font-medium">Categoría</label>
        <select
          [(ngModel)]="categoryId"
          name="category"
          class="w-full bg-white/20 text-white border border-white/30 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        >
          <option *ngFor="let categoria of categories" [value]="categoria.id">
            {{ categoria.name }}
          </option>
        </select>
      </div>

      <!-- Nombre -->
      <div>
        <label for="name" class="block mb-1 text-sm font-medium">Nombre</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          required
          class="w-full px-4 py-2 bg-white/20 text-white placeholder-white/70 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Descripción -->
      <div>
        <label for="description" class="block mb-1 text-sm font-medium">Descripción</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="description"
          required
          rows="4"
          class="w-full px-4 py-2 bg-white/20 text-white border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        ></textarea>
      </div>

      <!-- Precio -->
      <div>
        <label for="price" class="block mb-1 text-sm font-medium">Precio</label>
        <input
          type="number"
          id="price"
          name="price"
          [(ngModel)]="price"
          required
          class="w-full px-4 py-2 bg-white/20 text-white border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Imagen -->
      <div>
        <label for="img" class="block mb-1 text-sm font-medium">Imagen</label>
        <input
          type="file"
          id="img"
          name="img"
          (change)="onFileSelected($event)"
          class="text-white bg-white/10 rounded-lg w-full px-4 py-2 border border-white/30 file:bg-cyan-600 file:text-white file:rounded file:px-4 file:py-2 file:border-0"
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button
          type="submit"
          class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-semibold transition"
        >
          Guardar producto
        </button>
      </div>
    </form>
  </div>
</section>
