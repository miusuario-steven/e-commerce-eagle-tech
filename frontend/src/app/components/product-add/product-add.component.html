<app-header-admin></app-header-admin>

<section class="min-h-screen bg-gradient-to-br from-galaxyStart via-galaxyMid to-galaxyEnd px-4 py-16 text-white">
  <div class="max-w-4xl mx-auto">

    <!-- 🌠 Título + Breadcrumb -->
    <div class="mb-10">
      <h1 class="text-3xl sm:text-4xl font-bold mb-2 drop-shadow-lg">🚀 Crear producto</h1>
      <nav class="text-white/70 text-sm">
        <ol class="flex space-x-2">
          <li><a routerLink="/" class="hover:text-cyan-400">Inicio</a></li>
          <li>/</li>
          <li>Crear producto</li>
        </ol>
      </nav>
    </div>

    <!-- 🌌 Formulario con efecto glass -->
    <form
      (ngSubmit)="addProduct()"
      enctype="multipart/form-data"
      class="space-y-6 bg-white/10 backdrop-blur-2xl rounded-2xl border border-white/10 shadow-xl shadow-violet-500/20 p-8 animate-fade-slide-up"
    >
      <input type="hidden" [(ngModel)]="id" name="id" />

      <!-- Categoría -->
      <div>
        <label class="block mb-1 text-sm font-semibold">Categoría</label>
        <select
          [(ngModel)]="categoryId"
          name="category"
          class="w-full bg-white/20 text-white border border-white/30 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400"
        >
          <option *ngFor="let categoria of categories" [value]="categoria.id">
            {{ categoria.name }}
          </option>
        </select>
      </div>

      <!-- Nombre -->
      <div>
        <label for="name" class="block mb-1 text-sm font-semibold">Nombre</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Nombre del producto"
          class="w-full px-4 py-2 bg-white/20 text-white placeholder-white/60 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Descripción -->
      <div>
        <label for="description" class="block mb-1 text-sm font-semibold">Descripción</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="description"
          required
          rows="4"
          placeholder="Breve descripción del producto"
          class="w-full px-4 py-2 bg-white/20 text-white placeholder-white/60 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        ></textarea>
      </div>

      <!-- Precio -->
      <div>
        <label for="price" class="block mb-1 text-sm font-semibold">Precio</label>
        <input
          type="number"
          id="price"
          name="price"
          [(ngModel)]="price"
          required
          class="w-full px-4 py-2 bg-white/20 text-white placeholder-white/60 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400"
        />
      </div>

      <!-- Imagen -->
      <div>
        <label for="img" class="block mb-1 text-sm font-semibold">Imagen</label>
        <input
          type="file"
          id="img"
          name="img"
          (change)="onFileSelected($event)"
          class="text-white bg-white/10 border border-white/30 rounded-lg w-full px-4 py-2 file:bg-cyan-600 file:text-white file:rounded file:px-4 file:py-2 file:border-0"
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button
          type="submit"
          class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-green-500/30 transition"
        >
          Guardar producto
        </button>
      </div>
    </form>
  </div>
</section>
