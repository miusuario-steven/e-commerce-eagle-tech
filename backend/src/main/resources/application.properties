spring.profiles.active= dev

# PayPal API Configuration
paypal.currency=USD
paypal.method=paypal
paypal.intent=sale
paypal.description=Compra en Eagle Tech Store
paypal.cancelUrl=http://localhost:4200/payment-cancel
paypal.successUrl=http://localhost:4200/payment-success

# Existing PayPal Redirect URLs (cleaned up and uncommented)
paypal.redirect.base-url=http://localhost:4200
paypal.redirect.success-path=/payment-success
paypal.redirect.cancel-path=/cart
paypal.redirect.error-path=/payment-error

paypal.clientId=YOUR_PAYPAL_CLIENT_ID
paypal.clientSecret=YOUR_PAYPAL_CLIENT_SECRET
paypal.mode=sandbox

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
